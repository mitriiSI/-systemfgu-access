worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    real_ip_header X-Forwarded-For;
    set_real_ip_from caddy;
    real_ip_recursive off;
    map "$uri:$request_method:$http_content_length:$http_transfer_encoding" $bad_read_body {
        default 0;
        ~^/__midiary_upload_auth: 0;
        ~^[^:]*:(GET|HEAD):(0)?:$ 0;
        ~^[^:]*:(GET|HEAD): 1;
    }
    map "$request_method:$uri:$http_content_type" $bad_upload_type {
        default 0;
        "~^POST:/api/(files|schedule/import/preview):multipart/form-data(?:;|$)" 0;
        ~^POST:/api/(files|schedule/import/preview): 1;
    }
    map $uri $edge_cache { default no-store; / no-cache; /sw.js no-cache; ~^/legal/ no-cache; }
    map $uri $edge_referrer { default same-origin; ~^/api/max/download/ no-referrer; }
    map $uri $backend_key { default $server_name; ~^/static/ ""; }
    map $uri $api_key { default ""; ~^/api/ $binary_remote_addr; }
    map $uri $heavy_key {
        default "";
        /api/schedule $binary_remote_addr;
        /api/study-materials $binary_remote_addr;
        /api/personal $binary_remote_addr;
    }
    map $uri $heavy_global { default ""; /api/schedule $server_name; /api/study-materials $server_name; /api/personal $server_name; }
    map "$request_method:$uri" $upload_key { default ""; "POST:/api/files" $server_name; "POST:/api/schedule/import/preview" $server_name; }
    limit_req_zone $backend_key zone=backend_rate:1m rate=40r/s;
    limit_req_zone $api_key zone=api_rate:2m rate=10r/s;
    limit_req_zone $heavy_key zone=heavy_rate:1m rate=2r/s;
    limit_req_zone $heavy_global zone=heavy_global_rate:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=client_connections:1m;
    limit_conn_zone $server_name zone=site_connections:1m;
    limit_conn_zone $upload_key zone=upload_connections:1m;
    upstream midiary {
        zone midiary 64k;
        server app:5000 resolve;
        keepalive 16;
    }
    server {
        listen 8080;
        server_name midiary;
        client_max_body_size 64k;
        if ($bad_read_body) { return 400; }
        if ($bad_upload_type) { return 415; }
        limit_req zone=backend_rate burst=80 nodelay;
        limit_req zone=api_rate burst=60 nodelay;
        limit_req zone=heavy_rate burst=6 nodelay;
        limit_req zone=heavy_global_rate burst=20 nodelay;
        limit_req_status 429;
        limit_req_log_level error;
        limit_conn client_connections 20;
        limit_conn site_connections 64;
        limit_conn upload_connections 2;
        limit_conn_status 429;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy $edge_referrer always;
        add_header Cache-Control $edge_cache always;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cache-Control;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 135s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        error_page 429 = @busy;
        error_page 401 = @login;
        error_page 403 = @denied;
        error_page 413 = @large;
        error_page 415 = @unsupported;
        location @unsupported { default_type application/json; return 415 '{"error":"Выберите файл и загрузите его через форму."}'; }
        location @busy { default_type application/json; add_header Retry-After 2 always; add_header Cache-Control no-store always; return 429 '{"error":"Слишком много запросов. Повторите через несколько секунд."}'; }
        location @login { default_type application/json; return 401 '{"error":"Войдите в аккаунт."}'; }
        location @denied { default_type application/json; return 403 '{"error":"Нет доступа. Обновите страницу и повторите вход."}'; }
        location @large { default_type application/json; return 413 '{"error":"Превышен допустимый размер запроса или файла."}'; }
        location /static/ {
            alias /srv/static/;
            autoindex off;
            disable_symlinks on;
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /api/upload-check { return 404; }
        location = /__midiary_upload_auth {
            internal;
            # The bodyless auth subrequest inherits the upload's original
            # Content-Length. Its own body limit must not reject that header.
            client_max_body_size 0;
            proxy_pass http://midiary/api/upload-check;
            proxy_pass_request_body off;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Content-Length "";
            proxy_set_header X-Midiary-Upload-Method $upload_method;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location = /api/files {
            set $upload_method $request_method;
            client_max_body_size 100m;
            auth_request /__midiary_upload_auth;
            proxy_request_buffering off;
            proxy_pass http://midiary;
        }
        location = /api/schedule/import/preview {
            set $upload_method $request_method;
            client_max_body_size 16m;
            auth_request /__midiary_upload_auth;
            proxy_request_buffering off;
            proxy_pass http://midiary;
        }
        location = /api/schedule/import/commit { client_max_body_size 1m; proxy_pass http://midiary; }
        location = /api/max/webhook { client_max_body_size 128k; proxy_pass http://midiary; }
        location / { proxy_pass http://midiary; }
    }
}
